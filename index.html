<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>B2 First Cambridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: cabecera fija con navegación + vistas de panel dividido (índice lateral + contenido).
   Identidad: hoja de examen Cambridge (marcador amarillo, burbujas de respuesta, un color por prueba). */
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --surface2:#E8ECF5; --ink:#15203B; --muted:#56627E; --line:#D5DBE8;
  --primary:#1B2A4A; --on-primary:#FFFFFF; --hl:#FFD84D; --hl-line:#FFD84D; --on-hl:#15203B;
  --reading:#2A55E0; --writing:#D4452A; --listening:#0B8585; --speaking:#7046CC; --ok:#17915A; --bad:#C23A2B; --shadow:0 1px 2px rgba(21,32,59,.06),0 8px 24px -12px rgba(21,32,59,.18);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Figtree','Segoe UI',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --hdr:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#131C32; --surface2:#1B2745; --ink:#E9EDF7; --muted:#9BA7C4; --line:#27355B;
  --primary:#FFD84D; --on-primary:#15203B; --hl-line:#8A6B00; --reading:#8AA6FF; --writing:#FF8D70; --listening:#45D1CA; --speaking:#B999FF; --ok:#44C98A; --bad:#FF8D70; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#131C32; --surface2:#1B2745; --ink:#E9EDF7; --muted:#9BA7C4; --line:#27355B;
  --primary:#FFD84D; --on-primary:#15203B; --hl-line:#8A6B00; --reading:#8AA6FF; --writing:#FF8D70; --listening:#45D1CA; --speaking:#B999FF; --ok:#44C98A; --bad:#FF8D70; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--reading);outline-offset:2px;border-radius:6px}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1220px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.mark{background:linear-gradient(transparent 60%,var(--hl-line) 60%);padding:0 .12em;margin:0 -.12em}

/* Cabecera */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .wrap{height:var(--hdr);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--hl);color:var(--on-hl);font-size:.95rem}
.brand small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:1px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-s{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-weight:500}
.btn-s:hover{border-color:var(--muted);color:var(--ink)}
.btn-s kbd{font:500 .7rem var(--f-mono);padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted)}

/* Barra inferior móvil */
.tabbar{display:none}
@media (max-width:820px){
  .nav,.btn-s .lbl,.btn-s kbd{display:none}
  .brand small{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:10px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
  main{padding-bottom:84px}
}

main{padding-block:28px 56px;min-height:70vh}
.view{animation:rise .28s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}html{scroll-behavior:auto}*{transition:none!important}}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;font-weight:700;border:2px solid var(--primary);transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:8px 13px;font-size:.9rem;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);font:500 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.chip.c{background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}

/* Inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:36px;align-items:center;padding-block:20px 8px}
.hero h1{font-size:clamp(2.3rem,6vw,4rem);font-weight:800}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:52ch;margin-top:18px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);transform:rotate(1.2deg);max-width:340px;justify-self:center;width:100%}
.sheet h3{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.arow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-of-type{border-bottom:0}
.arow .n{font:500 .85rem var(--f-mono);width:1.6em;color:var(--muted)}
.bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:500 .8rem var(--f-mono);color:var(--muted);transition:background .12s,color .12s,border-color .12s,transform .12s}
.bub:hover{border-color:var(--ink);transform:scale(1.06)}
.bub[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sheet .foot{font-size:.82rem;color:var(--muted);padding-top:12px;border-top:2px dashed var(--line)}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:28px}.sheet{transform:none}}

.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:40px}
.secard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.secard:hover{transform:translateY(-3px);border-color:var(--primary)}
.secard .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--hl);color:var(--on-hl)}
.secard .ico svg{width:24px;height:24px}
.secard h3{font-size:1.4rem}
.secard p{color:var(--muted);flex:1}
.secard .go{display:flex;align-items:center;gap:8px;font-weight:700}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:48px 0 16px;flex-wrap:wrap}
.sect-h h2{font-size:1.5rem}
.prog-card{display:flex;align-items:center;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:40px;flex-wrap:wrap}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.1rem var(--f-display)}
.prog-card h3{font-size:1.2rem}
.prog-card p{color:var(--muted)}
.papers-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.pstrip{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 9%,var(--surface));transition:transform .15s,border-color .15s}
.pstrip:hover{transform:translateY(-2px);border-color:var(--c)}
.pstrip .pi{width:40px;height:40px;border-radius:10px;background:var(--c);color:var(--surface);display:grid;place-items:center;flex:none}
.pstrip b{display:block;font-family:var(--f-display);font-size:1.05rem}
.pstrip span{font-size:.85rem;color:var(--muted)}

/* Panel dividido */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - var(--hdr) - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.side-title{padding:10px 10px 6px;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;font-weight:700;font-family:var(--f-display)}
.grp-h:hover{background:var(--surface2)}
.grp-h .cnt{margin-left:auto;font:500 .72rem var(--f-mono);color:var(--muted)}
.grp-h svg{transition:transform .15s;width:1em;height:1em}
.grp-h[aria-expanded="true"] svg{transform:rotate(90deg)}
.grp ul{list-style:none;margin:0 0 6px;padding:0 0 0 12px;margin-left:15px;border-left:2px solid var(--line)}
.grp[data-closed="true"] ul{display:none}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:.95rem;line-height:1.3}
.it:hover{background:var(--surface2);color:var(--ink)}
.it.on{background:var(--primary);color:var(--on-primary);font-weight:600}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;flex:none;opacity:.7;display:grid;place-items:center}
.dot.done{background:var(--ok);border-color:var(--ok);opacity:1;color:#fff}
.dot svg{width:10px;height:10px;stroke-width:3.2}
.side-toggle{display:none}
.pane{min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.crumbs button{font-weight:600}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs svg{width:.9em;height:.9em}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:var(--shadow)}
.paper h1{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800}
.paper .sum{color:var(--muted);font-size:1.08rem;margin-top:10px;max-width:62ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.body{margin-top:26px}
@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{display:none;position:static;max-height:none}
  .split.show-side .side{display:block}
  .side-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:600}
  .side-toggle .cur{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .side-toggle svg:last-child{margin-left:auto}
}

/* Contenido pendiente y estilos para la teoría futura */
.ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.ph>div{border:2px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.ph h3{font-size:1.05rem;color:var(--ink);margin-bottom:6px}
.ph p{font-size:.92rem}
.pending{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:.92rem}
.content{max-width:70ch}
.content h2{font-size:1.5rem;margin:1.6em 0 .5em}
.content h3{font-size:1.2rem;margin:1.4em 0 .4em}
.content p,.content ul,.content ol{margin:.7em 0}
.content li{margin:.3em 0}
.content table{border-collapse:collapse;width:100%;font-size:.95rem}
.content th,.content td{border:1px solid var(--line);padding:9px 12px;text-align:left}
.content th{background:var(--surface2)}
.content .rule,.content .example,.content .tip,.content .warn{border-radius:12px;padding:14px 18px;margin:1em 0;border:1px solid var(--line)}
.content .rule{background:color-mix(in srgb,var(--reading) 10%,var(--surface));border-color:color-mix(in srgb,var(--reading) 35%,var(--line))}
.content .example{background:color-mix(in srgb,var(--listening) 10%,var(--surface));border-color:color-mix(in srgb,var(--listening) 35%,var(--line))}
.content .tip{background:color-mix(in srgb,var(--hl) 22%,var(--surface));border-color:var(--hl-line)}
.content .warn{background:color-mix(in srgb,var(--writing) 10%,var(--surface));border-color:color-mix(in srgb,var(--writing) 35%,var(--line))}

.rel{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.rel h2{font-size:1.2rem;margin-bottom:12px}
.relcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);flex-wrap:wrap}
.relcard+.relcard{margin-top:10px}
.relcard .t{flex:1;min-width:180px}
.relcard b{display:block;font-family:var(--f-display)}
.relcard span{font-size:.88rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pn button{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pn button:hover{border-color:var(--primary)}
.pn button small{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.pn .next{text-align:right;align-items:flex-end}
.pn .next small{flex-direction:row-reverse}
.pn b{font-family:var(--f-display);font-size:.98rem}
@media (max-width:520px){.pn{grid-template-columns:1fr}.pn .next{text-align:left;align-items:flex-start}.pn .next small{flex-direction:row}}

/* Lecciones: resumen */
.stats{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.filters button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:.9rem;color:var(--muted);background:var(--surface)}
.filters button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.lcard{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--primary);transform:translateY(-2px)}
.lcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lcard b{font-family:var(--f-display);font-size:1.02rem;line-height:1.2}
.lcard small{color:var(--muted)}
.lgroup{margin-top:24px}
.lgroup h3{font-size:1.1rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.empty{padding:22px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

/* Exámenes */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:22px;scrollbar-width:thin}
.tabs button{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tabs button:hover{background:var(--surface2);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--c,var(--primary));color:var(--surface)}
:root:not([data-theme="dark"]) .tabs button[aria-selected="true"]{color:#fff}
.bar{display:flex;gap:4px;height:54px}
.bar button{flex:var(--w) 1 0;min-width:0;padding:0;overflow:hidden;font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);font:700 .8rem var(--f-mono);border:2px solid transparent;transition:background .15s,border-color .15s}
.bar button:hover{border-color:var(--c)}
.bar button[aria-pressed="true"]{background:var(--c);color:var(--surface)}
:root:not([data-theme="dark"]) .bar button[aria-pressed="true"]{color:#fff}
.bar-l{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 8px;color:var(--muted);font-size:.9rem}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:10px;font-size:.88rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:18px}
.fact{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--primary)) 9%,var(--surface));border:1px solid var(--line)}
.fact small{display:block;font:500 .68rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--f-display);font-size:1.25rem}
.pdetail{margin-top:22px;border-top:4px solid var(--c);border-radius:18px;background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(18px,3vw,28px);box-shadow:var(--shadow)}
.pdetail h2{font-size:1.6rem}
.pdetail .d{color:var(--muted);margin-top:6px;max-width:62ch}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pn2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--surface);font:800 .95rem var(--f-display)}
:root:not([data-theme="dark"]) .prow .pn2{color:#fff}
.prow b{font-family:var(--f-display)}
.prow small{display:block;color:var(--muted)}
.prow .q{font:500 .78rem var(--f-mono);color:var(--muted);white-space:nowrap}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 4px}

<script>
/* =====================================================================
   CONTENIDO DEL CURSO
   Aquí se añade todo lo que falta. Cada tema/lección tiene un campo `html`:
   mientras sea null se muestra un hueco "pendiente"; al rellenarlo con HTML
   aparece el contenido. Clases disponibles dentro del HTML:
   .rule (regla) .example (ejemplo) .tip (consejo) .warn (error frecuente), tablas, listas.
   ===================================================================== */
const T = (id,title,summary,tag)=>({id,title,summary,tag,html:null});
const GROUPS = [
  {id:'g1',title:'Tiempos verbales',topics:[
    T('t-present','Present simple y continuous','Hábitos, hechos y acciones en curso; verbos de estado.','Grammar'),
    T('t-past','Pasados: simple, continuous y perfect','Contar historias y ordenar acciones en el pasado.','Grammar'),
    T('t-perfect','Present perfect','Experiencias, resultados y duración hasta ahora.','Grammar'),
    T('t-future','Formas de futuro','Will, going to, present continuous y future perfect.','Grammar')]},
  {id:'g2',title:'Modales y condicionales',topics:[
    T('t-modals','Verbos modales','Obligación, permiso, posibilidad y deducción.','Grammar'),
    T('t-cond','Condicionales','Zero, first, second, third y mixtos.','Grammar'),
    T('t-wish','Wish e if only','Deseos y arrepentimientos sobre presente y pasado.','Grammar')]},
  {id:'g3',title:'Estructuras de la frase',topics:[
    T('t-passive','Voz pasiva','Formas, usos y la pasiva con verbos de opinión.','Grammar'),
    T('t-reported','Estilo indirecto','Cambios de tiempo y verbos de comunicación.','Grammar'),
    T('t-relative','Oraciones de relativo','Defining, non-defining y reducción de relativos.','Grammar'),
    T('t-linking','Conectores','Contraste, causa, resultado y finalidad.','Grammar')]},
  {id:'g4',title:'Vocabulario',topics:[
    T('t-phrasal','Phrasal verbs','Los más frecuentes en el examen, agrupados por tema.','Vocabulary'),
    T('t-colloc','Colocaciones y expresiones','Combinaciones naturales de palabras.','Vocabulary'),
    T('t-wordform','Formación de palabras','Prefijos, sufijos y cambios de categoría.','Vocabulary')]}
];
const LESSONS = [
  {id:'l-present',topic:'t-present',title:'Práctica de presentes'},
  {id:'l-past',topic:'t-past',title:'Práctica de pasados'},
  {id:'l-perfect',topic:'t-perfect',title:'Práctica de present perfect'},
  {id:'l-future',topic:'t-future',title:'Práctica de futuro'},
  {id:'l-modals',topic:'t-modals',title:'Práctica de modales'},
  {id:'l-cond',topic:'t-cond',title:'Práctica de condicionales'},
  {id:'l-wish',topic:'t-wish',title:'Práctica de wish e if only'},
  {id:'l-passive',topic:'t-passive',title:'Práctica de voz pasiva'},
  {id:'l-reported',topic:'t-reported',title:'Práctica de estilo indirecto'},
  {id:'l-relative',topic:'t-relative',title:'Práctica de relativos'},
  {id:'l-linking',topic:'t-linking',title:'Práctica de conectores'},
  {id:'l-phrasal',topic:'t-phrasal',title:'Práctica de phrasal verbs'},
  {id:'l-colloc',topic:'t-colloc',title:'Práctica de colocaciones'},
  {id:'l-wordform',topic:'t-wordform',title:'Práctica de formación de palabras'}
].map(l=>({...l,html:null}));

/* Exámenes de práctica: se añaden como { id, title, html } dentro de cada prueba */
const EXAMS = {reading:[], listening:[], writing:[], speaking:[]};

/* Estructura oficial del B2 First (Cambridge English) */
const PAPERS = [
  {id:'reading',name:'Reading and Use of English',short:'Reading',color:'var(--reading)',icon:'read',minutes:75,time:'1 h 15 min',nparts:7,items:'52 preguntas',weight:40,
   desc:'Una sola prueba con siete partes: las tres primeras comprueban vocabulario y gramática en textos con huecos, la cuarta reescritura de frases y las tres últimas comprensión lectora. Los textos suman entre 2.200 y 2.500 palabras.',
   parts:[
    {n:1,name:'Multiple-choice cloze',q:'8 preguntas',tests:'Vocabulario',d:'Texto con 8 huecos. Eliges entre A, B, C o D la palabra correcta: colocaciones, phrasal verbs, matices de significado.'},
    {n:2,name:'Open cloze',q:'8 preguntas',tests:'Gramática y vocabulario',d:'Texto con 8 huecos. Escribes una sola palabra en cada uno: preposiciones, auxiliares, artículos, conectores.'},
    {n:3,name:'Word formation',q:'8 preguntas',tests:'Formación de palabras',d:'Texto con 8 huecos. Transformas la palabra base que se da al margen: prefijos, sufijos y cambios de categoría.'},
    {n:4,name:'Key word transformation',q:'6 preguntas · hasta 2 puntos',tests:'Gramática y vocabulario',d:'Reescribes una frase para que signifique lo mismo que la original, usando la palabra clave dada y entre dos y cinco palabras.'},
    {n:5,name:'Multiple choice',q:'6 preguntas · 2 puntos cada una',tests:'Detalle, opinión y actitud',d:'Un texto largo con seis preguntas de cuatro opciones sobre detalles, opiniones y actitud del autor.'},
    {n:6,name:'Gapped text',q:'6 preguntas · 2 puntos cada una',tests:'Estructura y desarrollo del texto',d:'Un texto al que le faltan seis frases o párrafos. Los colocas en su hueco entre varias opciones, y sobra una.'},
    {n:7,name:'Multiple matching',q:'10 preguntas',tests:'Localizar información concreta',d:'Varios textos cortos o un texto dividido en secciones. Asocias cada una de las 10 afirmaciones con el texto donde aparece.'}]},
  {id:'listening',name:'Listening',short:'Listening',color:'var(--listening)',icon:'head',minutes:40,time:'≈ 40 min',nparts:4,items:'30 preguntas',weight:20,
   desc:'Cuatro partes con grabaciones de distinto tipo. Cada grabación se escucha dos veces.',
   parts:[
    {n:1,name:'Multiple choice',q:'8 preguntas',tests:'Idea general, detalle y opinión',d:'Ocho grabaciones cortas e independientes, de unos 30 segundos. Cada una tiene una pregunta con tres opciones.'},
    {n:2,name:'Sentence completion',q:'10 preguntas',tests:'Información concreta',d:'Un monólogo de tres a cuatro minutos. Completas diez frases con una palabra o una expresión corta que oyes.'},
    {n:3,name:'Multiple matching',q:'5 preguntas',tests:'Gist y opinión del hablante',d:'Cinco monólogos cortos sobre un mismo tema. Asocias cada hablante con una de las ocho afirmaciones, y sobran tres.'},
    {n:4,name:'Multiple choice',q:'7 preguntas',tests:'Opinión, actitud y detalle',d:'Una entrevista o conversación de tres a cuatro minutos entre dos hablantes, con siete preguntas de tres opciones.'}]},
  {id:'writing',name:'Writing',short:'Writing',color:'var(--writing)',icon:'pen',minutes:80,time:'1 h 20 min',nparts:2,items:'2 textos',weight:20,
   desc:'Dos textos de entre 140 y 190 palabras cada uno. El primero es obligatorio; en el segundo se elige una tarea.',
   parts:[
    {n:1,name:'Essay (obligatorio)',q:'1 texto · 140–190 palabras',tests:'Argumentar y dar una opinión',d:'Un ensayo sobre un tema de interés general. Se desarrollan dos ideas que da el enunciado y una tercera propia, con una opinión razonada.'},
    {n:2,name:'Tarea a elegir',q:'1 texto · 140–190 palabras',tests:'Adaptar el registro al destinatario',d:'Eliges una tarea entre varias. Los formatos posibles son article, email o carta, review y report.'}]},
  {id:'speaking',name:'Speaking',short:'Speaking',color:'var(--speaking)',icon:'mic',minutes:14,time:'14 min por pareja',nparts:4,items:'2 examinadores',weight:20,
   desc:'Se hace en pareja (o en trío, con 20 minutos) y con dos examinadores. Una grupo de cuatro partes, de lo personal a la discusión.',
   parts:[
    {n:1,name:'Interview',q:'≈ 2 min por candidato',tests:'Interacción social',d:'El examinador te hace preguntas sobre ti: información personal, experiencias y opiniones.'},
    {n:2,name:'Long turn',q:'1 min + 30 s de respuesta del compañero',tests:'Comparar, describir y especular',d:'Comparas dos fotografías y respondes a una pregunta. Tu compañero comenta brevemente la suya al terminar.'},
    {n:3,name:'Collaborative task',q:'2 min de debate + 1 min de decisión',tests:'Interactuar y llegar a acuerdos',d:'Habláis con vuestro compañero sobre una propuesta con varias opciones y tomáis una decisión conjunta.'},
    {n:4,name:'Discussion',q:'≈ 4 min',tests:'Opinar y justificar',d:'El examinador amplía el tema de la parte 3 con preguntas a cada candidato y se continúa la discusión.'}]}
];
PAPERS[3].desc = 'Se hace en pareja (o en trío, con 20 minutos) y con dos examinadores. Son cuatro partes, de lo personal a la discusión.';

/* =====================================================================
   LÓGICA
   ===================================================================== */
const VIEWS=[['inicio','Inicio','home'],['teoria','Teoría','book'],['examenes','Exámenes','exam'],['lecciones','Lecciones','tasks']];
const IC={
 home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 21h16"/><path d="M9 7h7"/>',
 exam:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M8.5 12h7M8.5 16h4"/>',
 tasks:'<path d="M4 7l2 2 3-3M4 17l2 2 3-3M13 8h7M13 18h7"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>', chev:'<path d="M9 6l6 6-6 6"/>', menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 read:'<path d="M3 5.5C5 4.5 8 4.5 12 6c4-1.5 7-1.5 9-.5V19c-2-1-5-1-9 .5-4-1.5-7-1.5-9-.5z"/><path d="M12 6v13.5"/>',
 head:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', model:'<path d="M4 6h16M4 12h16M4 18h10"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

const TOPICS=GROUPS.flatMap(g=>g.topics.map(t=>({...t,gid:g.id,gtitle:g.title})));
const TOPIC=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
GROUPS.forEach(g=>g.topics.forEach((t,i)=>{TOPIC[t.id].html=t.html;}));
const LESSON=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const lessonsOf=tid=>LESSONS.filter(l=>l.topic===tid);
const PAPER=Object.fromEntries(PAPERS.map(p=>[p.id,p]));

let store={done:[],last:{},closed:[],acts:{}};
try{const raw=localStorage.getItem('b2first.v1');if(raw)store=Object.assign(store,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem('b2first.v1',JSON.stringify(store));}catch(e){}};
const isDone=id=>store.done.includes(id);

const S={view:'inicio',topic:null,lesson:null,side:false,filter:'all',exTab:'modelo',model:'reading',part:{reading:0,listening:0,writing:0,speaking:0},exItem:null,ltab:'temas',bk:'contents',fi:{},bx:{}};
const $=s=>document.querySelector(s), app=$('#app');

function ring(done,total){
  const r=36,c=2*Math.PI*r,pct=total?done/total:0;
  return `<div class="ring" role="img" aria-label="${done} de ${total} lecciones completadas"><svg viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="${r}"/><circle class="fg" cx="42" cy="42" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}"/></svg><b>${Math.round(pct*100)}%</b></div>`;
}
const dot=id=>`<span class="dot ${isDone(id)?'done':''}">${isDone(id)?ic('check'):''}</span>`;

/* ---------- INICIO ---------- */
function vHome(){
  const done=LESSONS.filter(l=>isDone(l.id)).length, total=LESSONS.length;
  const lastT=store.last.topic&&TOPIC[store.last.topic];
  const startLbl=lastT?`Continuar: ${esc(lastT.title)}`:'Empezar con la teoría';
  const rows=[['A','B','C','D'],['A','B','C','D'],['A','B','C','D']].map((r,i)=>`<div class="arow"><span class="n">${i+1}</span>${r.map(o=>`<button class="bub" data-act="bub" aria-pressed="false" aria-label="Pregunta ${i+1}, opción ${o}">${o}</button>`).join('')}</div>`).join('');
  return `<div class="view">
  <section class="hero">
    <div>
      <span class="chip">Cambridge English · Nivel B2</span>
      <h1 style="margin-top:16px">Prepara el <span class="mark">B2 First</span> paso a paso</h1>
      <p class="lead">Teoría ordenada por temas, lecciones con tareas para practicar y exámenes separados por prueba. Todo en un solo sitio y a tu ritmo.</p>
      <div class="cta">
        <button class="btn pri" data-act="${lastT?'topic':'nav'}" data-id="${lastT?lastT.id:''}" data-view="teoria">${startLbl} ${ic('arrow')}</button>
        <button class="btn sec" data-act="nav" data-view="examenes">Ver cómo es el examen</button>
      </div>
    </div>
    <div class="sheet" aria-label="Hoja de respuestas de ejemplo">
      <h3><span>Answer sheet</span><span>Part 1</span></h3>${rows}
      <p class="foot">Marca una burbuja. Así empieza cada práctica.</p>
    </div>
  </section>

  <div class="cards3">
    <button class="secard" data-act="nav" data-view="teoria"><span class="ico">${ic('book')}</span><h3>Teoría</h3><p>${TOPICS.length} temas en ${GROUPS.length} bloques: gramática y vocabulario explicados con ejemplos.</p><span class="go">Abrir teoría ${ic('arrow')}</span></button>
    <button class="secard" data-act="nav" data-view="examenes"><span class="ico">${ic('exam')}</span><h3>Exámenes</h3><p>El modelo oficial con sus 4 pruebas y ${PAPERS.reduce((a,p)=>a+p.parts.length,0)} partes, y un espacio para practicar cada una.</p><span class="go">Abrir exámenes ${ic('arrow')}</span></button>
    <button class="secard" data-act="nav" data-view="lecciones"><span class="ico">${ic('tasks')}</span><h3>Lecciones</h3><p>${total} lecciones con tareas. Márcalas como completadas según avances en la teoría.</p><span class="go">Abrir lecciones ${ic('arrow')}</span></button>
  </div>

  <div class="prog-card">${ring(done,total)}
    <div style="flex:1;min-width:200px"><h3>Tu progreso</h3><p>${done} de ${total} lecciones completadas${done===total&&total?'. Curso terminado.':'.'}</p></div>
    <button class="btn sec sm" data-act="nav" data-view="lecciones">Ver mis lecciones</button>
  </div>

  <div class="sect-h"><h2>El examen de un vistazo</h2><span class="mono" style="color:var(--muted)">4 pruebas</span></div>
  <div class="papers-strip">${PAPERS.map(p=>`<button class="pstrip" style="--c:${p.color}" data-act="exam" data-paper="${p.id}"><span class="pi">${ic(p.icon)}</span><span><b>${p.short}</b><span>${p.time} · ${p.nparts} partes</span></span></button>`).join('')}</div>
  </div>`;
}

/* ---------- Índice lateral ---------- */
function sideTree(kind){
  if(kind==='book')return bookSide();
  const cur=kind==='topic'?S.topic:S.lesson;
  const grp=GROUPS.map(g=>{
    const items=kind==='topic'?g.topics:LESSONS.filter(l=>TOPIC[l.topic].gid===g.id);
    if(!items.length)return '';
    const closed=store.closed.includes(kind+g.id);
    const cnt=kind==='topic'?items.length:`${items.filter(i=>isDone(i.id)).length}/${items.length}`;
    return `<div class="grp" data-closed="${closed}"><button class="grp-h" data-act="group" data-g="${kind+g.id}" aria-expanded="${!closed}">${ic('chev')}<span>${esc(g.title)}</span><span class="cnt">${cnt}</span></button>
      <ul>${items.map(i=>`<li><button class="it ${i.id===cur?'on':''}" data-act="${kind}" data-id="${i.id}" ${i.id===cur?'aria-current="true"':''}>${kind==='lesson'?dot(i.id):''}<span>${esc(i.title)}</span></button></li>`).join('')}</ul></div>`;
  }).join('');
  return `<aside class="side" aria-label="Índice">${kind==='lesson'?`<button class="it ${S.lesson?'':'on'}" data-act="lessons-home" style="font-weight:700">${ic('list2')||''}<span>Resumen de lecciones</span></button>`:''}<div class="side-title">${kind==='topic'?'Temas de teoría':'Lecciones'}</div>${grp}</aside>`;
}
IC.list2='<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>';

function splitWrap(kind,curLabel,pane){
  return `<div class="view split ${S.side?'show-side':''}">
    <button class="side-toggle" data-act="toggle-side" aria-expanded="${S.side}">${ic('menu')}<span>Índice</span><span class="cur">${esc(curLabel)}</span>${ic('chev')}</button>
    ${sideTree(kind)}<section class="pane">${pane}</section></div>`;
}

/* ---------- TEORÍA ---------- */
function vTheory(){
  if(!S.topic)S.topic=(store.last.topic&&TOPIC[store.last.topic])?store.last.topic:TOPICS[0].id;
  const t=TOPIC[S.topic], idx=TOPICS.findIndex(x=>x.id===t.id), prev=TOPICS[idx-1], next=TOPICS[idx+1];
  const body=t.html?`<div class="content">${t.html}</div>`:`<div class="pending">${chipPending()}<span>La teoría de este tema se añadirá aquí.</span></div>
    <div class="ph"><div><h3>Explicación</h3><p>Reglas y formas del tema, paso a paso.</p></div><div><h3>Ejemplos</h3><p>Frases de uso real, como las del examen.</p></div><div><h3>Errores frecuentes</h3><p>Lo que más se falla en el B2 First.</p></div></div>`;
  const rel=lessonsOf(t.id);
  const relHtml=rel.length?`<div class="rel"><h2>Practica este tema</h2>${rel.map(l=>`<div class="relcard">${dot(l.id)}<div class="t"><b>${esc(l.title)}</b><span>${isDone(l.id)?'Completada':'Pendiente'}</span></div><button class="btn pri sm" data-act="lesson" data-id="${l.id}">Ir a la lección ${ic('arrow')}</button></div>`).join('')}</div>`:'';
  const pane=`<div class="crumbs"><button data-act="nav" data-view="teoria">Teoría</button>${ic('chev')}<span>${esc(t.gtitle)}</span></div>
  <article class="paper"><h1>${esc(t.title)}</h1><p class="sum">${esc(t.summary)}</p>
    <div class="meta"><span class="chip">${esc(t.tag)}</span><span class="chip">Tema ${idx+1} de ${TOPICS.length}</span></div>
    <div class="body">${body}</div>${relHtml}</article>
  <div class="pn">${prev?`<button data-act="topic" data-id="${prev.id}"><small>${ic('back')} Anterior</small><b>${esc(prev.title)}</b></button>`:'<span></span>'}${next?`<button class="next" data-act="topic" data-id="${next.id}"><small>${ic('arrow')} Siguiente</small><b>${esc(next.title)}</b></button>`:''}</div>`;
  return splitWrap('topic',t.title,pane);
}
const chipPending=()=>`<span class="chip">Contenido pendiente</span>`;

/* ---------- LECCIONES ---------- */
function vLessonsTopics(){
  if(S.lesson&&LESSON[S.lesson])return vLesson();
  const done=LESSONS.filter(l=>isDone(l.id)).length,total=LESSONS.length;
  const f=S.filter, ok=l=>f==='all'||(f==='done'?isDone(l.id):!isDone(l.id));
  const groups=GROUPS.map(g=>{
    const ls=LESSONS.filter(l=>TOPIC[l.topic].gid===g.id&&ok(l));
    if(!ls.length)return '';

function grade(a,st){
  const v=st.v;
  if(a.t==='fill'||a.t==='kwt'||a.t==='rewrite')return a.items.map((it,i)=>okV(it.a,v[i])?'ok':'bad');
  if(a.t==='prefix')return a.items.map((it,i)=>{const w=lc(v[i]).split(/\s+/).filter(Boolean);return w[0]===it.a?(w.length>1?'ok':'half'):'bad';});
  if(a.t==='choose')return a.items.map((it,i)=>v[i]===it.a?'ok':'bad');
  if(a.t==='exam')return a.ans.map((L,i)=>v[i]===L?'ok':'bad');
  if(a.t==='getit'){const nz=x=>(x||'').toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();return (a.items||[{ans:a.ans}]).map((it,i)=>nz(v[i])===nz(it.ans)?'ok':'bad');}
  if(a.t==='table')return tableAns(a).map((x,i)=>x.split('|').includes(lc(v[i]))?'ok':'bad');
  if(a.t==='sort')return a.words.map((w,i)=>v[i]===w[1]?'ok':'bad');
  if(a.t==='match')return a.ans.map((L,i)=>v[i]===L?'ok':'bad');
  if(a.t==='mcq')return a.ans.map((L,i)=>v[i]===L?'ok':'bad');
  if(a.t==='ctext')return a.ans.map((L,i)=>v[i]===L?'ok':'bad');
  if(a.t==='getpick')return [v[0]===a.ans?'ok':'bad'];
  if(a.t==='cloze')return a.ans.map((x,i)=>x.split('|').includes(lc(v[i]))?'ok':'bad');
  if(a.t==='mix'){const g=mixParse(a);return g.map(it=>it.segs.every(sg=>sg.k===undefined||gapOk(sg,v))?'ok':'bad');}
  return [];
}

 {t:'cloze',num:'2',title:'EXAM TASK',exam:true,ex:{word:'ABOUT'},name:'The importance of friendship',img:'friends',imgPos:'right',alt:'Two friends talking on a sofa',
  instr:'For questions 1–8, read the text below and think of the word which best fits each gap. Use only one word in each gap. There is an example at the beginning (0).',
  ans:['without','though|if|when','because','another','for','no|little','who','same'],
  text:["It is undeniable that friendship is important for just {0} everyone. Individuals with several close friends are usually happier than those {1}. Good friends often know things that family members may not be aware of, even {2} they have lived together for years. This is probably {3} when in the company of a good friend we share our secrets and dreams. Friends turn to one {4} for suggestions on how to solve their problems. There is a tendency {5} close friends to be very honest, sometimes saying things the other person may not want to hear!",
        "Good friends stick together, and the best relationships may last a lifetime. It is {6} surprise that most friends have similar personalities, which reduces the risk of conflict. However, people don't always have an accurate picture of {7} their true friends are. Research shows that in a surprising number of cases a person someone considers a good friend doesn't feel the {8} about them."]},
 {t:'fill',num:'3a',title:'Complete the sentences with the correct form of the phrasal verbs in the box.',cw:8,box:['break up','bring up','count on','fall out','get on with','get together','look up to','take after'],items:[

  {s:'Everyone says I ___ my father; people are always pointing out the similarities in the way we look and behave.',a:'take after'},
  {s:'In my last year at university I ___ with my girlfriend and she got together with someone else.',a:'broke up'},
  {s:"I've known Tom for twenty years and he's my best friend; I can always ___ him.",a:'count on'},

   "Without a second thought, I grabbed my smartphone, searched for the song and found the name, Bob Dylan. For me and my friends, this is a completely natural course of action, but it totally astonished my grandfather, who didn't understand how I had checked the information so quickly. My sister and I laughed and explained, but afterwards, it made me think about how much I depend on technology.",
   "The list of the ways I use technology is endless: writing, planning, socialising, communicating and shopping, to name a few. When I reflected on its impact on my education, I saw that, for my fellow students and I, technology has been significant in many ways. Returning to the story of my grandfather and the smartphone, he had asked me more about how I used it and about university life. He said he thought we had an easy life compared to previous generations. My sister caught my eye and we exchanged a smile. But whereas she was thinking our grandfather was just being a typical 65-year-old, I could see his point.",
   "Not only are we lucky enough to have the same educational benefits as those of previous generations, we have so many more as well. We still have walk-in libraries available to us, and I can see why some students choose to find and use resources in these distraction-free locations. However, the only option for studying used to be sitting in these libraries with as many books from your reading list as you could find, yet now a single search for your chosen study topic online can immediately provide access to a huge range of resources. At universities, interaction between students and university staff is another area that has changed considerably with developments in technology. We can have face-to-face time with our tutors when we need it, and also communicate using our electronic gadgets from the comfort of our homes, or on the bus. The most popular means of doing this is via instant messaging or social media – email is often considered too slow, and it has become unacceptable for messages to be unanswered for any length of time. While this puts an extra strain on the university's academic support team, who usually have to answer the queries as they come in, we students are greatly benefitted.",
   "It's important that we remember to appreciate how much the advances in technology have given us. Electronic devices such as tablets, smartphones, and laptops are now standard equipment in most classrooms and lecture halls, and why shouldn't they be? The replacement of textbooks with tablets allows students the luxury of having up-to-date, interactive and even personalised learning materials, with the added benefit of them not costing the earth.",
   "When we compare the student life of the past and that of the present day, it is tempting to focus on the obvious differences when it comes to technology. In actual fact, students are doing what they've always done: embracing the resources available and adapting them in ways which allow them to work more efficiently and to live more enjoyably. The pace of change in technology continuously gathers speed, so we have to value each innovation as it happens."],

 {t:'mcq',num:'1',title:'EXAM TASK',instr:MC_INSTR('a review of a TV programme about homes of the future'),name:'The homes of the future viewed from today',by:"Mark Finchley reviews TV series Tomorrow's Homes",img:'robot',imgPos:'right',alt:'A robot vacuuming next to a man on a sofa',
  paras:["Having just watched the whole of Channel 8's TV series Tomorrow's Homes, I've been wondering about how anyone can predict the future of domestic life. You'd imagine that if you knew what architects and technology companies were developing now to make life easier, more exciting and more beautiful, you'd have a pretty good idea of what to expect in tomorrow's homes. In reality, it's more complicated, and just as much about what we'll choose to hang on to from today's – the things that are 'future-proof'. In the 1950s, people thought that in the twenty-first century household tasks would be done by labour-saving devices or robots – with food pills for dinner. Yet people still wash up and cook, even though the technology exists that makes neither of these tasks necessary.",
   "Tomorrow's Homes, however, dared to make predictions which it turned into reality using an average home belonging to a family called the Forseys. Four miles of cable were installed in the house so that all the electrics, from lights to the fridge, could be controlled via the internet, and various other devices and gadgets were introduced in addition to this. The family were then filmed as they got used to their new home life. Programme presenter Harry Thwaites is also a consultant who spends his work life imagining the future, so testing out his ideas for the programme was a fascinating experiment for him. His approach was to use technology that was not totally brand new, but had only recently become more affordable. CCTV cameras for security have been around for years, for example, but they are no longer only an option for the mega-rich.",

   "I was keen to see during the show if anything emerged as potentially future-proof, and there were some great examples. To help Janine deal with various worries, she was provided with a mind-controlled relaxation tool. This was a kind of headband connected to a DVD, which, incredibly, she could control with her thoughts. When she relaxed mentally, she made an image of the sun go down, as it would at night, on the DVD. When she had tried the gadget and achieved the sun set, she was asked how effective the gadget had been. Janine commented, 'Nothing can compare to a nice cup of tea and a good soap opera!'"],

function pgWS(w){
  const c=PC[w.paper], fi=Math.min(S.fi[w.id]||0,w.fichas.length-1), f=w.fichas[fi], acts=ACTS[w.id+'.'+fi];
  const tabs=w.fichas.map((x,i)=>`<button role="tab" class="${ACTS[w.id+'.'+i]?'':'empty'}" data-act="fi" data-w="${w.id}" data-i="${i}" aria-selected="${i===fi}">Ficha ${i+1}</button>`).join('');
  const body=acts?acts.map((a,k)=>actHTML(w.id+'.'+fi+'.'+k,a,c)).join(''):`<div style="margin-top:22px">${pending('Las actividades de esta ficha se añadirán aquí.')}</div>`;
  return `<span class="chip c" style="--c:${c}">${esc(PN[w.paper])}</span>
   <h1 class="bk-title" style="margin-top:12px">${esc(w.title)}</h1>
   <div class="bk-sub"><span class="chip">${esc(w.task)}</span><span class="chip">${esc(w.q)}</span><span class="chip">${nFichas(w)}</span></div>
   <div class="ftabs" role="tablist" aria-label="Fichas" style="--c:${c}">${tabs}</div>
   <div class="fbody" style="--c:${c}"><div class="fhead"><span class="chip c" style="--c:${c}">Ficha ${fi+1}</span><h2>${esc(f.theme)}</h2><div class="pts">${f.pts.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>${body}</div>`;
}
function vBooster(){
  const b=BKBY[S.bk]||BKBY.contents, i=b.n, prev=BK[i-1], next=BK[i+1];
  const label=b.kind==='ws'?PN[b.w.paper]:b.title;
  let inner;
  if(b.kind==='contents')inner=pgContents();
  else if(b.kind==='map')inner=pgMap();
  else if(b.kind==='ws')inner=pgWS(b.w);
  else inner=`<h1 class="bk-title">${esc(b.title)}</h1><div class="body">${pending()}</div>`;
  const pane=`<div class="crumbs"><button data-act="ltab" data-t="temas">Lecciones</button>${ic('chev')}<button data-act="bk" data-id="contents">Exam Booster</button>${b.id!=='contents'?ic('chev')+'<span>'+esc(b.title)+'</span>':''}</div>
  <article class="book" style="--c:${b.c}"><span class="ribbon"></span><div class="book-head"><b>Exam Booster</b><span>${esc(label)}</span></div>
   <div class="book-page">${inner}</div><div class="book-foot">${i+1} / ${BK.length}</div></article>
  <div class="pn">${prev?`<button data-act="bk" data-id="${prev.id}"><small>${ic('back')} Anterior</small><b>${esc(prev.title)}</b></button>`:'<span></span>'}${next?`<button class="next" data-act="bk" data-id="${next.id}"><small>${ic('arrow')} Siguiente</small><b>${esc(next.title)}</b></button>`:''}</div>`;
  return splitWrap('book',b.title,pane);
}
function vLessons(){
  const tabs=`<div class="ltabs" role="tablist" aria-label="Lecciones"><button role="tab" data-act="ltab" data-t="temas" aria-selected="${S.ltab==='temas'}">${ic('tasks')}Lecciones por tema</button><button role="tab" data-act="ltab" data-t="booster" aria-selected="${S.ltab==='booster'}">${ic('book')}Exam Booster</button></div>`;
  return `<div>${tabs}${S.ltab==='booster'?vBooster():vLessonsTopics()}</div>`;
}

/* ---------- EXÁMENES ---------- */
function vExams(){
  const tabs=[['modelo','Modelo de examen','model',null],...PAPERS.map(p=>[p.id,p.short,p.icon,p.color])];
  const tb=`<div class="tabs" role="tablist" aria-label="Secciones de exámenes">${tabs.map(([id,n,i,c])=>`<button role="tab" data-act="exam" data-paper="${id}" aria-selected="${S.exTab===id}" ${c?`style="--c:${c}"`:''}>${ic(i)}${n}</button>`).join('')}</div>`;
  return `<div class="view">${tb}${S.exTab==='modelo'?exModel():exPaper(PAPER[S.exTab])}</div>`;
}
function bar(kind){
  const tot=PAPERS.reduce((a,p)=>a+(kind==='t'?p.minutes:p.weight),0);
  return `<div class="bar">${PAPERS.map(p=>`<button style="--c:${p.color};--w:${kind==='t'?p.minutes:p.weight}" data-act="model" data-paper="${p.id}" aria-pressed="${S.model===p.id}" aria-label="${p.short}: ${kind==='t'?p.time:p.weight+'%'}">${kind==='t'?p.minutes+'′':p.weight+'%'}</button>`).join('')}</div>`;
}
function exModel(){
  const p=PAPER[S.model];
  return `<article class="paper"><h1>Modelo de examen B2 First</h1>
  <p class="sum">El B2 First consta de cuatro pruebas. Las notas de cada una se suman en una puntuación total en la escala de Cambridge English. Elige una prueba en las barras para ver su detalle.</p>
  <div style="margin-top:28px"><div class="bar-l"><b>Duración de cada prueba</b><span>Total ≈ 3 h 29 min</span></div>${bar('t')}</div>
  <div style="margin-top:22px"><div class="bar-l"><b>Peso en la nota final</b><span>100 %</span></div>${bar('w')}</div>
  <div class="legend">${PAPERS.map(q=>`<span style="--c:${q.color}"><i></i>${q.short}</span>`).join('')}</div>
  <div class="pdetail" style="--c:${p.color}">
    <div class="meta" style="margin:0 0 10px"><span class="chip c" style="--c:${p.color}">${ic(p.icon)} ${p.short}</span></div>
    <h2>${esc(p.name)}</h2><p class="d">${esc(p.desc)}</p>
    <div class="facts" style="--c:${p.color}"><div class="fact"><small>Duración</small><b>${p.time}</b></div><div class="fact"><small>Partes</small><b>${p.nparts}</b></div><div class="fact"><small>Contenido</small><b>${p.items}</b></div><div class="fact"><small>Peso</small><b>${p.weight}%</b></div></div>
    <div style="margin-top:18px">${p.parts.map(q=>`<div class="prow" style="--c:${p.color}"><span class="pn2">${q.n}</span><div><b>${esc(q.name)}</b><small>${esc(q.tests)}</small></div><span class="q">${esc(q.q)}</span></div>`).join('')}</div>
    <div class="actions"><button class="btn pri" data-act="exam" data-paper="${p.id}">Ir a ${p.short} ${ic('arrow')}</button></div>
  </div>
  <div class="sect-h" style="margin-top:36px"><h2 style="font-size:1.25rem">Escala de puntuación</h2><span class="mono" style="color:var(--muted)">Cambridge English Scale</span></div>
  <div class="scale"><div><b>180–190</b><span>Nivel C1 (grade A)</span></div><div class="pass"><b>173–179</b><span>B2, grade B</span></div><div class="pass"><b>160–172</b><span>B2, grade C</span></div><div><b>140–159</b><span>Nivel B1</span></div></div>
  <p style="color:var(--muted);font-size:.9rem;margin-top:12px">Con 160 puntos o más se obtiene el certificado de nivel B2.</p>
  </article>`;
}
function exPaper(p){
  const i=S.part[p.id], q=p.parts[i], list=EXAMS[p.id];
  const ex=S.exItem&&list.find(e=>e.id===S.exItem);
  const practice=ex?`<div class="actions" style="margin-top:0"><button class="btn sec sm" data-act="exitem" data-id="">${ic('back')} Volver a la lista</button></div><h3 style="margin:16px 0 10px">${esc(ex.title)}</h3><div class="content">${ex.html||''}</div>`
   :(list.length?`<div class="exlist">${list.map(e=>`<button class="lcard" data-act="exitem" data-id="${e.id}"><b>${esc(e.title)}</b><small>Abrir examen</small></button>`).join('')}</div>`
   :`<div class="empty">Todavía no hay exámenes de ${p.short}. Aparecerán aquí en cuanto se añadan.</div>`);
  return `<article class="paper" style="--c:${p.color}"><div class="meta" style="margin:0 0 12px"><span class="chip c">${ic(p.icon)} Paper</span></div>
  <h1>${esc(p.name)}</h1><p class="sum">${esc(p.desc)}</p>
  <div class="facts"><div class="fact"><small>Duración</small><b>${p.time}</b></div><div class="fact"><small>Partes</small><b>${p.nparts}</b></div><div class="fact"><small>Contenido</small><b>${p.items}</b></div><div class="fact"><small>Peso</small><b>${p.weight}%</b></div></div>
  <div class="pills" role="group" aria-label="Partes de ${p.short}">${p.parts.map((x,k)=>`<button data-act="part" data-paper="${p.id}" data-i="${k}" aria-pressed="${k===i}">Part ${x.n}</button>`).join('')}</div>
  <div class="pdetail" style="--c:${p.color}"><div class="meta" style="margin:0 0 10px"><span class="chip c">Part ${q.n}</span><span class="chip">${esc(q.q)}</span></div>
    <h2>${esc(q.name)}</h2><p class="d"><b>Qué se evalúa:</b> ${esc(q.tests)}.</p><p class="d" style="color:var(--ink)">${esc(q.d)}</p></div>
  <div class="sect-h" style="margin-top:34px"><h2 style="font-size:1.3rem">Exámenes de práctica · ${p.short}</h2></div>${practice}
  </article>`;
}

/* ---------- Render y navegación ---------- */
function renderChrome(){
  $('#nav').innerHTML=VIEWS.map(([id,n,i])=>`<button data-act="nav" data-view="${id}" ${S.view===id?'aria-current="page"':''}>${ic(i)}${n}</button>`).join('');
  $('#tabbar').innerHTML=VIEWS.map(([id,n,i])=>`<button data-act="nav" data-view="${id}" ${S.view===id?'aria-current="page"':''}>${ic(i)}<span>${n}</span></button>`).join('');
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeBtn').innerHTML=ic(dark?'sun':'moon');
}
function render(keep){
  const y=window.scrollY;
  app.innerHTML=({inicio:vHome,teoria:vTheory,examenes:vExams,lecciones:vLessons})[S.view]();
  renderChrome();
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);
  document.title='B2 First Cambridge';
}
function go(view,keep){
  S.view=view;S.side=false;
  try{history.replaceState(null,'','#'+view);}catch(e){}
  render(keep);
}
function openTopic(id){S.topic=id;store.last.topic=id;save();go('teoria');}
function openLesson(id){S.lesson=id;store.last.lesson=id;save();go('lecciones');}

function a0(e,el,key,st,a,act){
  if(act==='a-check'){st.c=true;}
  else if(act==='a-show'){st.c=true;st.r=true;}
  else if(act==='a-reset'){delete store.acts[key];FOC[key]=undefined;SEL[key]=undefined;}
  else if(act==='a-chip'){
    const w=el.dataset.w;let i=FOC[key];
    const n=(a.items||a.ans).length;if(i===undefined||st.v[i]){i=-1;for(let k=0;k<n;k++)if(!st.v[k]){i=k;break;}}
    if(i<0)return false;
    st.v[i]=w;st.c=false;st.r=false;
  }else if(act==='s-pick'){const i=+el.dataset.i;SEL[key]=SEL[key]===i?undefined:i;}
  else if(act==='s-put'){if(SEL[key]===undefined)return false;st.v[SEL[key]]=+el.dataset.c;SEL[key]=undefined;st.c=false;st.r=false;}
  else if(act==='s-back'){st.v[+el.dataset.i]=null;st.c=false;st.r=false;}
  else if(act==='a-mcq'){st.v[+el.dataset.i]=el.dataset.o;st.c=false;st.r=false;}
  else if(act==='a-opt'){st.v[+el.dataset.i]=el.dataset.o;st.c=false;st.r=false;}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'nav':
      if(d.view==='lecciones'&&S.view!=='lecciones')S.lesson=null;
      if(d.view==='examenes')S.exItem=null;
      go(d.view);break;
    case 'topic':openTopic(d.id);break;
    case 'lesson':openLesson(d.id);break;
    case 'lessons-home':S.lesson=null;go('lecciones');break;
    case 'toggle-done':{const i=store.done.indexOf(d.id);i<0?store.done.push(d.id):store.done.splice(i,1);save();render(true);break;}
    case 'filter':S.filter=d.f;render(true);break;
    case 'group':{const k=d.g,i=store.closed.indexOf(k);i<0?store.closed.push(k):store.closed.splice(i,1);save();render(true);break;}
    case 'toggle-side':S.side=!S.side;render(true);break;
    case 'exam':S.exTab=d.paper;S.exItem=null;go('examenes');break;
    case 'model':S.model=d.paper;render(true);break;
    case 'part':S.part[d.paper]=+d.i;S.exItem=null;render(true);break;
    case 'exitem':S.exItem=d.id||null;render(true);break;
    case 'bub':{const row=el.parentElement;row.querySelectorAll('.bub').forEach(b=>b.setAttribute('aria-pressed',b===el&&el.getAttribute('aria-pressed')!=='true'?'true':'false'));break;}
    case 'theme':{const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('b2first.theme',r.dataset.theme);}catch(x){}renderChrome();break;}
    case 'bkf':S.bk=d.w;S.fi[d.w]=+d.i;S.bx[d.w]=true;S.ltab='booster';go('lecciones');break;
    case 'bx':{const w=d.w,cur=S.bx[w]!==undefined?S.bx[w]:S.bk===w;S.bx[w]=!cur;render(true);break;}
    case 'fi':S.fi[d.w]=+d.i;render(true);break;
    case 'a-check':case 'a-show':case 'a-reset':case 'a-chip':case 'a-opt':case 's-pick':case 's-put':case 's-back':case 'a-mcq':{
      const key=el.closest('.act').dataset.key,a=actDef(key),st=AS(key);
      if(a==='a-reset'){}
      if(a0(e,el,key,st,a,d.act)===false)break;
      save();redraw(key);break;}
    case 'ltab':S.ltab=d.t;S.lesson=null;go('lecciones');break;
    case 'bk':S.bk=d.id;S.ltab='booster';go('lecciones');break;
    case 'pal':openPal();break;
    case 'palx':closePal();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,box=el.closest&&el.closest('.act');if(!box||el.dataset.i===undefined)return;
  const st=AS(box.dataset.key);st.v[+el.dataset.i]=el.value;st.c=false;st.r=false;el.classList.remove('ok','bad','half');save();
  if(el.matches('input.cell')){const a=actDef(box.dataset.key);if(a.t==='fill'||a.t==='cloze'){const used=st.v.map(lc);box.querySelectorAll('.wbox button').forEach(b=>b.disabled=used.includes(b.dataset.w));}}
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.matches||!el.matches('select.gsel'))return;
  const box=el.closest('.act'),st=AS(box.dataset.key);st.v[+el.dataset.i]=el.value;st.c=false;st.r=false;el.classList.remove('ok','bad');save();
});
document.addEventListener('focusin',e=>{const el=e.target,box=el.closest&&el.closest('.act');if(box&&el.matches('input.cell'))FOC[box.dataset.key]=+el.dataset.i;});
try{const th=localStorage.getItem('b2first.theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}

/* ---------- Buscador ---------- */
const pal=$('#pal'),palIn=$('#palIn'),palRes=$('#palRes');let palSel=0,palList=[];
const INDEX=[
  ...TOPICS.map(t=>({k:'Teoría',t:t.title,s:t.summary+' '+t.gtitle,run:()=>openTopic(t.id)})),
  ...LESSONS.map(l=>({k:'Lección',t:l.title,s:TOPIC[l.topic].title,run:()=>openLesson(l.id)})),
  ...BK.map(b=>({k:'Exam Booster',t:b.title,s:b.kind==='ws'?b.w.task+' '+b.w.fichas.map(f=>f.theme+' '+f.pts.join(' ')).join(' '):'',run:()=>{S.bk=b.id;S.ltab='booster';go('lecciones');}})),
  ...PAPERS.flatMap(p=>[{k:'Examen',t:p.name,s:p.desc,run:()=>{S.exTab=p.id;S.exItem=null;go('examenes');}},
    ...p.parts.map((q,i)=>({k:p.short,t:`Part ${q.n} · ${q.name}`,s:q.tests+' '+q.d,run:()=>{S.exTab=p.id;S.part[p.id]=i;S.exItem=null;go('examenes');}}))])
];
function palRender(){
  const q=norm(palIn.value.trim());
  palList=(q?INDEX.filter(x=>norm(x.t+' '+x.s+' '+x.k).includes(q)):INDEX.filter(x=>x.k==='Teoría'||x.k==='Examen')).slice(0,30);
  palSel=0;
  palRes.innerHTML=palList.length?palList.map((x,i)=>`<button data-i="${i}" class="${i===0?'on':''}"><span>${esc(x.t)}</span><span class="k">${esc(x.k)}</span></button>`).join(''):`<div class="none">Sin resultados para «${esc(palIn.value)}».</div>`;
}
function openPal(){pal.classList.add('open');palIn.value='';palRender();setTimeout(()=>palIn.focus(),0);}
function closePal(){pal.classList.remove('open');}
function palMove(d){const bs=palRes.querySelectorAll('button');if(!bs.length)return;bs[palSel].classList.remove('on');palSel=(palSel+d+bs.length)%bs.length;bs[palSel].classList.add('on');bs[palSel].scrollIntoView({block:'nearest'});}
palIn.addEventListener('input',palRender);
palRes.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b){closePal();palList[+b.dataset.i].run();}});
pal.addEventListener('mousedown',e=>{if(e.target===pal)closePal();});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.classList.contains('open')?closePal():openPal();return;}
  if(!pal.classList.contains('open'))return;
  if(e.key==='Escape')closePal();
  else if(e.key==='ArrowDown'){e.preventDefault();palMove(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1);}
  else if(e.key==='Enter'&&palList[palSel]){e.preventDefault();closePal();palList[palSel].run();}
});

/* ---------- Arranque ---------- */
(function(){
  const h=(location.hash||'').slice(1);
  if(['inicio','teoria','examenes','lecciones'].includes(h))S.view=h;
  render();
})();
</script>
